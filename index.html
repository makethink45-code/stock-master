<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>WayStock Master - Digital Inventory</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-title">
        <span>📦</span> WayStock Master
        <span class="brand-badge">PWA v2.4</span>
      </div>
    </div>

    <!-- Search Box with Voice Assistant Button -->
    <div class="search-box-container">
      <div class="search-input-wrapper">
        <span class="search-icon-left">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search inventory or type 'admin.html'..." autocomplete="off">
      </div>
      <button id="voice-search-btn" class="voice-btn" title="Voice Search Assistant">🎙️</button>

      <!-- Search Suggestions Dropdown -->
      <div id="search-suggestions" class="search-suggestion-chips"></div>
    </div>
  </header>

  <!-- Interactive Breadcrumb Navigation Trail -->
  <nav id="breadcrumb-section" class="breadcrumb-section"></nav>

  <!-- Selection Toolbar (Appears during Long-Press Selection Mode) -->
  <div id="selection-toolbar" class="selection-toolbar">
    <span id="selected-count">0 Selected</span>
    <div class="toolbar-actions">
      <button onclick="selectAllVisibleItems()" class="toolbar-btn">Select All</button>
      <button onclick="addSelectedToCart()" class="toolbar-btn" style="background:var(--accent-emerald);">+ Add to Cart</button>
      <button onclick="cancelSelectionMode()" class="toolbar-btn" style="background:var(--accent-rose);">Cancel</button>
    </div>
  </div>

  <!-- Inventory Main List View Container -->
  <main id="inventory-list" class="inventory-list"></main>

  <!-- Floating Cart Toggle Bar -->
  <div id="cart-floating-bar" class="cart-floating-bar" onclick="openCartModal()" style="display:none;">
    <div class="cart-bar-left">
      <span>🛒 Bucket</span>
      <span id="cart-badge-count" class="cart-badge">0</span>
    </div>
    <div class="cart-bar-right">
      <span>View Cart ›</span>
    </div>
  </div>

  <!-- Cart / Bucket Modal Sheet -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title">🛒 My Order Bucket</span>
        <button onclick="closeCartModal()" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div id="cart-items-list"></div>
        <div style="margin-top:20px;">
          <button onclick="generateCartPreview()" class="btn-primary">
            <span>📄</span> Generate Canvas Order Slip
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Interactive Triple-Image Zoom Viewer Modal -->
  <div id="zoom-modal" class="modal-overlay">
    <div class="modal-sheet" style="max-width:550px; align-self:center; border-radius:24px;">
      <div class="modal-header">
        <span class="modal-title">📄 Order Slip Preview</span>
        <button onclick="closeZoomModal()" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <!-- Hardware Accelerated Zoom Track Slider -->
        <div class="zoom-slider-container">
          <div id="zoom-track-slider" class="zoom-track-slider"></div>
        </div>

        <div style="display:flex; justify-content:between; gap:10px; margin-top:16px;">
          <button onclick="prevZoomSlide()" class="btn-secondary" style="flex:1;">‹ Prev</button>
          <button onclick="nextZoomSlide()" class="btn-secondary" style="flex:1;">Next ›</button>
        </div>

        <div style="margin-top:12px;">
          <button onclick="shareOrDownloadSlip()" class="btn-primary">
            <span>📤</span> Export & Flush Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="common.js"></script>
  <script src="user-script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
