<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f0f4f8">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <title>User Page</title>
    <link rel="stylesheet" href="style.css">


</head>
<body>
    <div id="user-onboarding-modal" class="modal-overlay user-login-active">
    <div class="bulk-modal onboarding-card" style="text-align: center;">
<div class="avatar-view" id="avatar-emoji">👋</div>
        <h2 class="welcome-title">Welcome to WayStock</h2>
        <p class="welcome-subtitle">Apna naam daal kar apni personal bucket chalu karein!</p>
        
        <div class="modal-body" style="padding-top: 12px;">
            <input type="text" id="user-name-input" placeholder="Enter your name..." autocomplete="off" spellcheck="false" maxlength="20">
            
            <div class="modal-actions" style="margin-top: 16px;">
<button id="user-submit-btn" class="add-inventory-fun-btn" style="width: 100%; margin: 0;" onclick="submitNewUserProfile()">Let's Go 🚀</button>
            </div>
        </div>
    </div>
</div>

<div id="mic-overlay" class="recording-overlay">
    <div class="voice-wave-container">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
    <p class="listening-text">Listening...</p>
</div>

    <div class="app-container">
<header class="main-header">
    <div class="app-name">Way Stock</div>
    
    <div class="header-actions">
        <button class="icon-btn" aria-label="Search" id="search-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>

        <button class="icon-btn" aria-label="Cart" id="cart-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </button>
    </div>
</header>
    
    
        <main class="content-body">
    <div class="action-bar">
        
<div id="breadcrumb-section" class="breadcrumb-container">
</div>
<div id="search-section" class="search-container">
    <div class="search-wrapper">
<span class="search-icon">🔍</span>
        <input type="text" id="main-search-input" placeholder="Search items..." autocomplete="off">
        <button class="mic-btn" id="voice-search-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
<div id="search-suggestion-chips" class="sober-search-dropdown"></div>
    </div>
</div>


    </div>

    <div class="main-content-area"></div>
</main>

</div>
<div id="cart-section" class="full-page-section">
    
    <div class="cart-header">
        <button class="icon-btn close-cart" onclick="window.history.back()">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h3>My Bucket</h3>
    </div>

    <div id="cart-content-area" class="cart-body">
        <div class="empty-state">
<div class="empty-icon">🛒</div>

<button class="fun-btn" onclick="window.history.back()">Maal Bharo! 🚀</button>

<button class="checkout-btn" onclick="generateCartPreview()">Preview Order 🚀</button>

        </div>
    </div>

    <div class="cart-footer" style="display: none;">
    <div class="total-info">
        <span>Total Items: <b id="cart-count">0</b></span>
    </div>
    <button class="checkout-btn" onclick="generateCartPreview()">Preview Order 🚀</button>
</div>

</div>
<div id="preview-section" class="full-page-section">
    <div class="setting-header">
        <button class="icon-btn" onclick="window.history.back()">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h3>Order Images</h3>
    </div>
    <div id="preview-content-area" class="cart-body" style="justify-content: flex-start; overflow-y: auto; padding: 16px 0;">
        </div>
</div>
<div id="cloud-gateway-overlay" class="gateway-overlay">
    <div class="gateway-card">
        <div id="gateway-visuals" class="gateway-visuals ready">
            <div class="keyhole-icon"></div>
        </div>
        <h3>Admin Cloud Access</h3>
        <p>Enter Master Security PIN</p>
        <div class="gateway-input-wrapper">
            <input type="password" id="gateway-pin-input" placeholder="••••">
            <div class="input-focus-effect"></div>
        </div>
        <button id="gateway-submit-btn">ACTIVATE PORTAL</button>
        <div id="gateway-failure-hands" class="failure-hands"></div>
    </div>
</div>
<div id="preview-zoom-overlay" class="preview-zoom-overlay">
    
    <button class="zoom-close-btn" onclick="closeInteractiveZoomView()" aria-label="Close View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    
    <div class="zoom-viewport-container" onclick="event.stopPropagation()">
        <img id="zoom-target-image" src="" alt="Magnified Slip Target" onclick="event.stopPropagation()">
    </div>
</div>

<div id="custom-alert-container" class="alert-container"></div>

<script src="common.js"></script>
<script src="service-worker.js"></script>
<script src="user-script.js"></script>
</body>
</html>
